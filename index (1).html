<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="weather-card">
      <h1>Weather App</h1>
      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name..." />
        <button id="searchBtn">Search</button>
      </div>
      <div class="error" id="errorMsg"></div>
      <div class="weather-info" id="weatherInfo">
        <div class="top">
          <div>
            <h2 id="cityName"></h2>
            <p id="date"></p>
          </div>
          <img id="weatherIcon" src="" alt="Weather Icon" />
        </div>
        <div class="temp-section">
          <h1 id="temperature"></h1>
          <p id="description"></p>
        </div>
        <div class="details">
          <div class="detail-box"><span>Humidity</span><h3 id="humidity"></h3></div>
          <div class="detail-box"><span>Wind</span><h3 id="wind"></h3></div>
          <div class="detail-box"><span>Feels Like</span><h3 id="feelsLike"></h3></div>
          <div class="detail-box"><span>Pressure</span><h3 id="pressure"></h3></div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
